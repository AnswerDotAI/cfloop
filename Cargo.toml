[package]
name = "cfloop"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "An asyncio event loop on macOS's CFRunLoop, so coroutines, Carbon events, and main-queue delegates share the main thread"

[lib]
name = "cfloop"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = ">=0.28", features = ["extension-module", "abi3-py312"] }

[build-dependencies]
pyo3-build-config = "0.29"

[profile.test]
inherits = "release"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.cfloop]
incremental = true

[profile.dist]
inherits = "release"
lto = "thin"
incremental = false
strip = true

[profile.dist.package.cfloop]
incremental = false
